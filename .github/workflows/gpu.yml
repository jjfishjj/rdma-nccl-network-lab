name: NCCL and RDMA benchmark
on: {workflow_dispatch: {}}
jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, gpu, infiniband]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nvidia-lab/nccl .
      - run: mkdir -p network-report
      - run: docker run --rm --gpus all --network host --ipc=host --ulimit memlock=-1:-1 --cap-add IPC_LOCK -v /dev/infiniband:/dev/infiniband -v "$PWD/network-report:/workspace/network-report" -e THEORETICAL_GBPS="${THEORETICAL_GBPS:-200}" nvidia-lab/nccl
      - uses: actions/upload-artifact@v4
        with: {name: nccl-rdma-report, path: network-report}
